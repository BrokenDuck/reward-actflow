[project]
name = "reward-actflow"
version = "0.1.0"
description = "Reward extension for actflow"
readme = "README.md"
authors = [
    { name = "QuantumDuck", email = "40206399+BrokenDuck@users.noreply.github.com" },
]
requires-python = ">=3.13"
dependencies = [
    "diffusers>=0.39.0",
    "diffusiongym",
    "flowmol",
    "gpytorch>=1.15.2",
    "imageio[ffmpeg]>=2.37.4",
    "matplotlib>=3.11.1",
    "numba>=0.66.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "peft>=0.20.0",
    "pillow>=12.3.0",
    "pyg-lib>=0.8.0",
    "pyiqa>=0.1.16",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "torch<2.13",
    "torch-geometric>=2.8.0.post1",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "transformers>=5.14.1",
    "vendi-score[images,molecules]>=0.0.3",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
pyg-lib = { index = "pyg" }
torch-scatter = { index = "pyg" }
torch-sparse = { index = "pyg" }
flowmol = { workspace = true }
diffusiongym = { workspace = true }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.12.0+cu132.html"
format = "flat"
explicit = true

[project.scripts]
reward-actflow = "reward_actflow:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/FlowMol-PyG", "packages/diffusiongym"]

[dependency-groups]
dev = ["pytest>=9.1.1"]
