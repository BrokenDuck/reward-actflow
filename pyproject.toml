[project]
authors = [{name = "Cristian Perez Jensen", email = "cristianpjensen@gmail.com"}]
dependencies = ["imageio[ffmpeg]>=2.37.2,<3", "vendi-score[images,molecules]>=0.0.3,<0.0.4"]
name = "active_pretraining"
requires-python = ">=3.8,<3.12"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu121"]
find-links = [
    { url = "https://data.dgl.ai/wheels/torch-2.3/cu121/repo.html" },
    { url = "https://data.pyg.org/whl/torch-2.3.1+cu121.html" }
]

[tool.pixi.pypi-dependencies]
active_pretraining = { path = ".", editable = true }
matplotlib = "*"
gpytorch = ">=1.14"
diffusers = "==0.33.1"
torch_scatter = "==2.1.2"
torch_cluster = "==1.6.3"
flowmol = { git = "https://github.com/cristianpjensen/FlowMol.git", rev = "8f4c98cbe68111e4e63480b250d925b6d960d3bc" }
clip = { git = "https://github.com/openai/CLIP.git" }
flowgym = "==1.11"

[tool.pixi.activation]
env = { DGLBACKEND = "pytorch" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
ffmpeg = ">=8.0.1,<9"
black = ">=25.12.0,<26"
ipykernel = ">=7.1.0,<8"

[tool.ruff.lint]

select = [
    "B",  # bugbear
    "D",  # pydocstyle
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming conventions
    "W",  # pycodestyle warnings
    "C4", # comprehensions
    "PL", # pylint
    "PT", # flake8-pytest-style
    "PIE", # misc lints
    "PYI", # flake8-pyi
    "TID", # tidy imports
    "TCH", # type-checking imports
    "RUF", # Ruff-specific rules
    "RSE", # flake8-raise
    "ICN001", # unconventional-import-alias
]
ignore = [
    "N806", # Non-lowercase variable in function
    "PLR0911", # Too many returns
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments to function call
    "PLR0914", # Too many locals
    "PLR0915", # Too many statements
    "PLR1702", # Too many nested-blocks
    "D105", # Docstring in dunder methods
    "N812",
    "D102",
    "D101",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff]
line-length = 120