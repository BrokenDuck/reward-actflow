[project]
authors = [{name = "Cristian Perez Jensen", email = "cristianpjensen@gmail.com"}]
dependencies = [
    "imageio[ffmpeg]>=2.37.2,<3",
    "vendi-score[images,molecules]>=0.0.3,<0.0.4",
    "peft>=0.8.2",
    "transformers>=4.45.0",
    "pyiqa>=0.1.14.1"
, "seaborn>=0.13.2,<0.14"]
name = "adm"
requires-python = ">=3.8,<3.12"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu121"]
find-links = [
    { url = "https://data.dgl.ai/wheels/torch-2.3/cu121/repo.html" },
    { url = "https://data.pyg.org/whl/torch-2.3.1+cu121.html" }
]

[tool.pixi.pypi-dependencies]
adm = { path = ".", editable = true }
matplotlib = "*"
gpytorch = ">=1.14"
diffusers = "==0.33.1"
torch_scatter = "==2.1.2"
torch_cluster = "==1.6.3"
flowmol = { git = "https://github.com/cristianpjensen/FlowMol.git", rev = "8f4c98cbe68111e4e63480b250d925b6d960d3bc" }
clip = { git = "https://github.com/openai/CLIP.git" }
# diffusiongym = "==2.0.0"
diffusiongym = { path = "../diffusiongym", editable = true }

[tool.pixi.pypi-options.dependency-overrides]
transformers = ">=4.45.0"

[tool.pixi.activation]
env = { DGLBACKEND = "pytorch" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
ffmpeg = ">=8.0.1,<9"
black = ">=25.12.0,<26"
ipykernel = ">=7.1.0,<8"
